<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuttelista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
main{max-width:560px;margin:10vh auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px;font-size:18px}
h1{font-size:34px;margin:0;line-height:1.15}
p{margin:0;color:var(--muted)}
form{display:flex;gap:10px;flex-wrap:wrap}
input{font:inherit;font-family:var(--mono,monospace);text-transform:uppercase;letter-spacing:.2em;width:7em;padding:.5em .7em;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.6em 1.1em;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
hr{border:0;border-top:1px solid var(--line);width:100%}
</style>
</head>
<body>
<header class="appbar"><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round"><path d="M5 19 15 9"/><path d="M13 5l6 6"/><path d="M5 5l4 4"/><path d="M15 15l4 4"/></svg></span>Kuttelista</div></header>
<main>
  <h1>Har du en kode?</h1>
  <p>Skriv inn de fire tegnene som står på skjermen.</p>
  <form id="join"><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Kode"><button class="btn primary">Bli med</button></form>
  <hr>
  <p>Leder du møtet? Lag et nytt møte og vis storskjermen.</p>
  <div><button class="btn" id="new">Lag nytt møte</button></div>
  <p id="err" style="color:var(--warn)"></p>
</main>
<script>
document.getElementById("join").onsubmit = e => { e.preventDefault(); const c = document.getElementById("code").value.trim().toUpperCase(); if (/^[A-Z2-9]{4}$/.test(c)) location.href = "/s/" + c; };
document.getElementById("new").onclick = async () => {
  try { const r = await fetch("/api/new", { method: "POST" }); if (!r.ok) throw 0; const { code, key } = await r.json(); location.href = "/vis/" + code + "#" + key; }
  catch { document.getElementById("err").textContent = "Fikk ikke laget møtet. Prøv igjen."; }
};
</script>
</body>
</html>
