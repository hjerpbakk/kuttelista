<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuttelista, storskjerm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;font-size:clamp(15px,1.15vw,22px);overflow:hidden}
.appbar{font-size:inherit}
.mini{display:flex;align-items:center;gap:14px;margin-left:auto}
.mini .qr{width:64px;height:64px;background:#fff;padding:4px;border-radius:6px}
.mini .qr img,.mini .qr canvas{width:100%!important;height:100%!important}
.mini .url{font-family:var(--mono);font-size:.85em;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:6px;font-weight:600}
.count b{font-size:1.6em;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;padding:2vh 3vw;display:flex;flex-direction:column}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.55em 1.1em;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:.75em;border:1px solid var(--line);border-radius:4px;padding:0 .35em;color:var(--muted);margin-left:.4em}

/* Lobby */
.lobby{flex:1;display:grid;grid-template-columns:auto 1fr;gap:5vw;align-items:center}
.bigqr{background:#fff;padding:18px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.bigqr img,.bigqr canvas{display:block;width:min(52vh,34vw)!important;height:auto!important}
.lobby h1{font-size:3em;margin:0 0 .2em;line-height:1.1}
.lobby .link{font-family:var(--mono);font-size:1.3em;color:var(--accent);margin:0 0 1.2em}
.joined{display:flex;align-items:baseline;gap:.4em;margin-bottom:.6em}
.joined b{font-size:4.5em;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:10px;max-width:640px;min-height:40px;margin-bottom:1.6em}
.pdot{width:28px;height:28px;border-radius:50%;background:var(--accent);animation:dotin .5s cubic-bezier(.3,1.7,.5,1) both}
.pdot:nth-child(3n+2){background:var(--hand)} .pdot:nth-child(3n){background:var(--need);opacity:.6}
@keyframes dotin{from{transform:scale(0)}to{transform:scale(1)}}

/* Stemming */
.vote{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(240px,24vw);gap:2.5vw}
.stage{display:flex;flex-direction:column;min-height:0;gap:1.6vh}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2.2vh 2vw;position:relative;overflow:hidden}
.feat h1{font-size:2.6em;margin:.15em 0 .15em;line-height:1.1;text-wrap:balance}
.feat p{margin:0;color:var(--muted);font-size:1.2em}
.feat.enter{animation:slidein .5s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.split{position:absolute;top:2vh;right:2vw;background:var(--warn-bg);color:var(--warn);font-weight:700;border-radius:999px;padding:.35em .9em;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.stamp{position:absolute;right:2vw;bottom:2vh;font-weight:800;font-size:1.6em;letter-spacing:.04em;text-transform:uppercase;border:4px solid currentColor;border-radius:12px;padding:.1em .5em;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.stamp.need{color:var(--need)} .stamp.hand{color:var(--hand)} .stamp.wait{color:var(--wait)}
.bars{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}
.col{display:flex;flex-direction:column;min-height:0;border-radius:16px;border:2px solid transparent;background:none;padding:0;text-align:center}
.col:hover{border-color:var(--line)}
.col .track{flex:1;min-height:0;display:flex;align-items:flex-end;background:var(--panel);border-radius:14px;overflow:hidden;position:relative}
.col .fill{width:100%;height:0;transition:height .7s cubic-bezier(.3,1.35,.5,1);border-radius:14px 14px 0 0}
.col .head{display:flex;align-items:baseline;justify-content:center;gap:.4em;padding-bottom:.3em}
.col .num{display:inline-block;font-size:3.2em;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.col .num.bump{animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.18)}}
.col .pct{color:var(--muted);font-variant-numeric:tabular-nums;min-width:3em;text-align:left}
.col .lbl{padding:.6em 0 .2em;font-weight:700;font-size:1.35em}
.col.need .num{color:var(--need)} .col.hand .num{color:var(--hand)} .col.wait .num{color:var(--wait)}
.col.need .fill{background:var(--need)} .col.need .lbl{color:var(--need)}
.col.hand .fill{background:var(--hand)} .col.hand .lbl{color:var(--hand)}
.col.wait .fill{background:var(--wait)} .col.wait .lbl{color:var(--wait)}
.col.lead .track{box-shadow:inset 0 0 0 3px currentColor}
.col.need.lead{color:var(--need)} .col.hand.lead{color:var(--hand)} .col.wait.lead{color:var(--wait)}
.foot{display:flex;align-items:center;gap:1.2vw;flex-wrap:wrap}
.prog{flex:1;min-width:160px}
.prog .t{font-size:1.1em;margin-bottom:.3em}
.prog .bar{height:10px;background:var(--panel);border-radius:999px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s ease}
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.4vh 1vw;overflow:auto;min-height:0}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side li button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:.35em .6em;display:flex;align-items:center;gap:.6em;font-size:.85em}
.side li button:hover{background:var(--panel)}
.side li.cur button{background:var(--accent-soft);font-weight:600}
.side .chipc{margin-left:auto;font-size:.8em;border-radius:6px;padding:.05em .5em;white-space:nowrap}
.chipc.need{background:var(--need-bg);color:var(--need)} .chipc.hand{background:var(--hand-bg);color:var(--hand)} .chipc.wait{background:var(--wait-bg);color:var(--wait)}

.clock{position:absolute;top:50%;right:2vw;transform:translateY(-50%);font-size:3.2em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);width:2.2em;height:2.2em;border-radius:50%;border:4px solid currentColor;display:grid;place-items:center}
.clock.hurry{color:var(--warn);animation:tick 1s ease-in-out infinite}
@keyframes tick{50%{transform:translateY(-50%) scale(1.08)}}
.col.hidden .num{color:var(--muted)}
.col.hidden .track{background:repeating-linear-gradient(-45deg,var(--panel) 0 14px,color-mix(in srgb,var(--panel) 70%,var(--line)) 14px 28px)}
@keyframes flash{0%{filter:brightness(1.25)}100%{filter:none}}

.feat .extra,.feat .stampbox{position:absolute;inset:0;pointer-events:none}
.feat.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.bars.counting .fill{transition:none}
.bars.drum .track{animation:drum .12s linear infinite alternate}
.bars.drum .num{animation:drum .1s linear infinite alternate}
@keyframes drum{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.col .num.tick{animation:tick2 .18s ease-out}
@keyframes tick2{from{transform:scale(1.25)}to{transform:scale(1)}}
.col.land .head{animation:land .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes land{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.col.winner .track{box-shadow:0 0 0 4px currentColor,0 0 40px color-mix(in srgb,currentColor 45%,transparent)}
.col.need.winner{color:var(--need)} .col.hand.winner{color:var(--hand)} .col.wait.winner{color:var(--wait)}

/* Oppsummering */
.sum{flex:1;min-height:0;display:flex;flex-direction:column;gap:2vh}
.sum h1{font-size:2.6em;margin:0;line-height:1.15}
.sum h1 em{font-style:normal;color:var(--wait)}
.cols3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}
.cols3>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.6vh 1.2vw;overflow:auto;min-height:0}
.cols3 h2{margin:0 0 .5em;font-size:1.3em}
.cols3 ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5em}
.cols3 li{animation:rise .5s ease both}
.cols3 li small{display:block;color:var(--muted);font-size:.85em}
.cols3 .wait li{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--wait) 60%,transparent);color:var(--muted)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.splits{color:var(--warn);font-size:1.15em}
.msg{flex:1;display:grid;place-items:center;text-align:center}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round"><path d="M5 19 15 9"/><path d="M13 5l6 6"/><path d="M5 5l4 4"/><path d="M15 15l4 4"/></svg></span>Prøvedatabase<span class="tag" style="margin-left:.6em">Kuttelista</span></div>
  <div class="mini" id="mini" hidden>
    <span class="url" id="miniurl"></span><div class="qr" id="miniqr"></div>
    <span class="count"><b id="minicount">0</b> med</span><span class="dot" id="dot"></span>
  </div>
</header>
<main id="main"><div class="msg"><h1>Kobler til</h1></div></main>
<script src="/features.js"></script>
<script src="/live.js"></script>
<script>
const code = location.pathname.split("/")[2].toUpperCase();
let key = location.hash.slice(1);
try { if (key) localStorage.setItem("kl-host-" + code, key); else key = localStorage.getItem("kl-host-" + code) || ""; } catch {}
if (location.hash) history.replaceState(null, "", location.pathname);
const voteUrl = location.origin + "/s/" + code;
const shortUrl = location.host + "/s/" + code;
const main = document.getElementById("main");
const F = Object.fromEntries(FEATURES.map(f => [f.id, f]));
let anim = null, lastFeat = "", lastLock = null, lastList = "", st = null, view = "", lastCur = null, prevShown = false, advanceTimer = null, lastVoters = 0;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function qr(el, size){ el.innerHTML = ""; new QRCode(el, { text: voteUrl, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }

if (!key) {
  main.innerHTML = '<div class="msg"><div><h1>Mangler nøkkelen til dette møtet</h1><p>Åpne lenken du fikk da møtet ble laget, eller lag et nytt møte på forsiden.</p></div></div>';
} else {
  document.getElementById("miniurl").textContent = shortUrl;
  qr(document.getElementById("miniqr"), 128);
  var live = connectLive("/ws/" + code + "?role=host&key=" + encodeURIComponent(key), s => { s.offset = (s.now || Date.now()) - Date.now(); st = s; render(); }, s => {
    document.getElementById("dot").className = "dot " + (s === "on" ? "on" : "off");
  });
}

function tally(fid){ return (st.tallies && st.tallies[fid]) || { need: 0, hand: 0, wait: 0 }; }
function analyse(t){
  const total = t.need + t.hand + t.wait;
  const sorted = ["need","hand","wait"].sort((a,b) => t[b] - t[a]);
  const top = sorted[0], tie = total > 0 && t[sorted[0]] === t[sorted[1]];
  const split = total >= 2 && (tie || t[top] / total <= 0.6);
  return { total, top: total && !tie ? top : null, split };
}
function nextOpen(from){
  for (let i = from + 1; i < FEATURES.length; i++) if (!st.locked[FEATURES[i].id]) return FEATURES[i].id;
  for (let i = 0; i < FEATURES.length; i++) if (!st.locked[FEATURES[i].id]) return FEATURES[i].id;
  return null;
}
function idx(fid){ return FEATURES.findIndex(f => f.id === fid); }
function left(){ return st.deadline ? Math.max(0, Math.ceil((st.deadline - (Date.now() + (st.offset || 0))) / 1000)) : 0; }
function revealed(){
  if (!st.cur) return false;
  if (st.locked[st.cur]) return true;
  const t = tally(st.cur), total = t.need + t.hand + t.wait;
  if (st.voters > 0 && total >= st.voters) return true;
  return left() <= 0;
}
setInterval(() => { if (st && st.phase === "vote" && view === "vote") renderVote(); }, 250);

function render(){
  if (!st) return;
  document.getElementById("mini").hidden = st.phase === "lobby";
  document.getElementById("minicount").textContent = st.voters;
  if (st.phase === "lobby") renderLobby();
  else if (st.phase === "summary") renderSummary();
  else renderVote();
}

function renderLobby(){
  if (view !== "lobby") {
    view = "lobby";
    main.innerHTML = `<div class="lobby"><div class="bigqr" id="bigqr"></div><div>
      <h1>Scan for å stemme</h1><p class="link">${esc(shortUrl)}</p>
      <div class="joined"><b id="jn">0</b><span id="jl">er med</span></div>
      <div class="dots" id="dots"></div>
      <button class="btn primary" id="start">Start med første funksjon</button></div></div>`;
    qr(document.getElementById("bigqr"), 520);
    document.getElementById("start").onclick = () => live.send({ t: "show", f: nextOpen(-1) || FEATURES[0].id });
    lastVoters = 0;
  }
  document.getElementById("jn").textContent = st.voters;
  const dots = document.getElementById("dots"), n = Math.min(st.voters, 60);
  while (dots.children.length < n) { const d = document.createElement("span"); d.className = "pdot"; dots.appendChild(d); }
  while (dots.children.length > n) dots.lastChild.remove();
}

function renderVote(){
  const fid = st.cur, f = F[fid] || { name: fid, desc: "", grp: "" };
  const t = tally(fid), a = analyse(t), lock = st.locked[fid];
  if (view !== "vote") {
    view = "vote"; lastCur = null; lastList = ""; lastFeat = ""; anim = null;
    main.innerHTML = `<div class="vote"><div class="stage">
      <div class="feat" id="feat"></div>
      <div class="bars">${["need","hand","wait"].map(c => `<button class="col ${c}" data-c="${c}" title="Lås som ${LABEL[c]}"><div class="head"><span class="num" id="n-${c}">0</span><span class="pct" id="p-${c}"></span></div><div class="track"><div class="fill" id="f-${c}"></div></div><div class="lbl">${SHORT[c]}<kbd>${c==="need"?1:c==="hand"?2:3}</kbd></div></button>`).join("")}</div>
      <div class="foot"><div class="prog"><div class="t" id="pt"></div><div class="bar"><i id="pb"></i></div></div>
        <button class="btn" id="prev">Forrige</button>
        <button class="btn" id="more" title="Ti sekunder til">+10 s<kbd>T</kbd></button>
        <button class="btn" id="reveal">Vis nå<kbd>V</kbd></button>
        <button class="btn primary" id="lock"></button>
        <button class="btn" id="next">Neste</button>
        <button class="btn" id="sum">Oppsummering<kbd>S</kbd></button></div>
      </div><aside class="side"><ol id="list"></ol></aside></div>`;
    main.querySelectorAll(".col").forEach(b => b.onclick = () => { if (revealed() && !anim) doLock(b.dataset.c); });
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    document.getElementById("more").onclick = () => live.send({ t: "extend" });
    document.getElementById("reveal").onclick = () => live.send({ t: "reveal" });
    document.getElementById("sum").onclick = () => live.send({ t: "phase", p: "summary" });
    document.getElementById("lock").onclick = () => { if (st.locked[st.cur]) live.send({ t: "unlock", f: st.cur }); else { const a2 = analyse(tally(st.cur)); if (a2.top) doLock(a2.top); } };
  }
  if (fid !== lastCur) {
    const el = document.getElementById("feat");
    el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    lastCur = fid; prevShown = revealed(); anim = null; lastFeat = ""; lastLock = lock ? lock.c : null;
  }
  const shown = revealed(), secs = left();
  if (shown && !prevShown) startReveal();
  prevShown = shown;
  const counting = !!anim;
  if (lock && lock.c !== lastLock) celebrate(lock.c);
  lastLock = lock ? lock.c : null;

  const featKey = [fid, shown, counting, secs, a.split && !lock].join("|");
  if (featKey !== lastFeat) {
    lastFeat = featKey;
    const body = `<span class="tag">${esc(f.grp)}</span><h1>${esc(f.name)}</h1><p>${esc(f.desc)}</p>`;
    const feat = document.getElementById("feat");
    feat.querySelector(".body") ? feat.querySelector(".body").innerHTML = body : feat.innerHTML = `<div class="body">${body}</div><div class="extra"></div>`;
    feat.querySelector(".extra").innerHTML =
      (!shown ? `<span class="clock${secs <= 5 ? " hurry" : ""}">${secs}</span>` : "") +
      (shown && !counting && a.split && !lock ? '<span class="split">Uenige</span>' : "") +
      "";
  }
  // Stempelet bygges bare når låsen endres, så animasjonen spilles én gang
  const sb = document.getElementById("feat").querySelector(".stampbox") || document.getElementById("feat").appendChild(Object.assign(document.createElement("div"), { className: "stampbox" }));
  const want = lock ? lock.c : "";
  if (sb.dataset.c !== want) { sb.dataset.c = want; sb.innerHTML = lock ? `<span class="stamp ${lock.c}">${SHORT[lock.c]}</span>` : ""; }
  if (!counting) {
    const denom = Math.max(st.voters, a.total, 1);
    for (const c of ["need","hand","wait"]) {
      document.getElementById("f-" + c).style.height = shown ? (t[c] / denom * 100) + "%" : "0%";
      document.getElementById("n-" + c).textContent = shown ? t[c] : "?";
      document.getElementById("p-" + c).textContent = shown && a.total ? Math.round(t[c] / a.total * 100) + " %" : "";
    }
  }
  for (const c of ["need","hand","wait"]) {
    const col = main.querySelector(".col." + c);
    col.classList.toggle("lead", shown && !counting && a.top === c && !lock);
    col.classList.toggle("hidden", !shown);
    col.classList.toggle("winner", !!lock && lock.c === c);
  }
  document.getElementById("pt").textContent = `${a.total} av ${st.voters} har stemt` + (!shown ? `. ${secs} s igjen.` : counting ? "." : a.split && !lock ? ". Spør noen fra hver side hvorfor." : "");
  document.getElementById("pb").style.width = Math.min(100, a.total / Math.max(st.voters, 1) * 100) + "%";
  document.getElementById("more").hidden = shown;
  document.getElementById("reveal").hidden = shown;
  const lb = document.getElementById("lock");
  lb.hidden = (!shown || counting) && !lock;
  lb.disabled = !lock && !a.top;
  lb.innerHTML = lock ? "Lås opp" : a.top ? `Lås: ${SHORT[a.top]}<kbd>L</kbd>` : (a.total ? "Uavgjort, klikk en kolonne" : "Ingen stemmer");
  const listKey = fid + JSON.stringify(st.locked);
  if (listKey === lastList) return;
  lastList = listKey;
  document.getElementById("list").innerHTML = FEATURES.map(x => {
    const l = st.locked[x.id];
    return `<li class="${x.id === fid ? "cur" : ""}"><button data-f="${x.id}">${esc(x.name)}${l ? `<span class="chipc ${l.c}">${SHORT[l.c]}</span>` : ""}</button></li>`;
  }).join("");
  document.querySelectorAll("#list button").forEach(b => b.onclick = () => live.send({ t: "show", f: b.dataset.f }));
}

function doLock(c){
  if (!st || st.phase !== "vote") return;
  const a = analyse(tally(st.cur));
  live.send({ t: "lock", f: st.cur, c, split: a.split });
  clearTimeout(advanceTimer);
  const from = idx(st.cur);
  advanceTimer = setTimeout(() => {
    const n = nextOpen(from);
    if (n) live.send({ t: "show", f: n }); else live.send({ t: "phase", p: "summary" });
  }, 2000);
}

// Avsløring: kort trommevirvel, så teller alle tre opp samtidig og bremser mot slutten
const BEAT = 500, COUNT = 1600;
function startReveal(){
  const bars = main.querySelector(".bars");
  const t0 = performance.now();
  anim = { t0 };
  bars.classList.add("counting", "drum");
  for (const c of ["need","hand","wait"]) { document.getElementById("f-" + c).style.height = "0%"; document.getElementById("n-" + c).textContent = "0"; document.getElementById("p-" + c).textContent = ""; }
  const shown = {};
  function frame(now){
    if (!anim || anim.t0 !== t0 || !st || !st.cur) return;
    const el = now - t0;
    if (el >= BEAT) bars.classList.remove("drum");
    const p = Math.min(1, Math.max(0, (el - BEAT) / COUNT));
    const e = 1 - Math.pow(1 - p, 2);
    const t = tally(st.cur), total = t.need + t.hand + t.wait, denom = Math.max(st.voters, total, 1);
    for (const c of ["need","hand","wait"]) {
      const v = Math.round(t[c] * e);
      document.getElementById("f-" + c).style.height = (t[c] / denom * 100 * e) + "%";
      const n = document.getElementById("n-" + c);
      if (shown[c] !== v) { shown[c] = v; n.textContent = v; n.classList.remove("tick"); void n.offsetWidth; n.classList.add("tick"); }
    }
    if (p < 1) return requestAnimationFrame(frame);
    anim = null;
    bars.classList.remove("counting");
    lastFeat = "";
    renderVote();
    const lead = main.querySelector(".col.lead");
    if (lead) { lead.classList.remove("land"); void lead.offsetWidth; lead.classList.add("land"); const r = lead.querySelector(".num").getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, colorOf(lead.dataset.c), 18); }
  }
  requestAnimationFrame(frame);
}

function colorOf(c){ return getComputedStyle(document.documentElement).getPropertyValue("--" + c).trim(); }

// Konklusjon: stempelet slår ned, kortet rister, og det spruter fra vinnerkolonnen
function celebrate(c){
  const feat = document.getElementById("feat");
  feat.classList.remove("shake"); void feat.offsetWidth; feat.classList.add("shake");
  const col = main.querySelector(".col." + c);
  if (col) {
    const r = col.querySelector(".track").getBoundingClientRect();
    burst(r.left + r.width / 2, r.bottom - Math.max(20, r.height * 0.3), colorOf(c), 46);
  }
  setTimeout(() => { const sr = feat.querySelector(".stamp"); if (sr) { const b = sr.getBoundingClientRect(); burst(b.left + b.width / 2, b.top + b.height / 2, colorOf(c), 24); } }, 180);
}

const fx = document.createElement("canvas");
fx.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
document.body.appendChild(fx);
const ctx = fx.getContext("2d");
let parts = [], fxRunning = false;
function burst(x, y, color, n){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const dpr = devicePixelRatio || 1;
  if (fx.width !== innerWidth * dpr) { fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; }
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 4, r: 3 + Math.random() * 5, life: 1, color: Math.random() < .6 ? color : colorOf(["need","hand","accent"][i % 3]), sq: Math.random() < .5, rot: Math.random() * 6 });
  }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(step); }
}
function step(){
  const dpr = devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.vx *= 0.98; p.life -= 0.022; p.rot += 0.2;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.sq) ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); else { ctx.beginPath(); ctx.arc(0, 0, p.r / 1.4, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  if (parts.length) requestAnimationFrame(step); else { fxRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}
function go(d){
  clearTimeout(advanceTimer);
  const i = idx(st.cur) + d;
  if (i >= 0 && i < FEATURES.length) live.send({ t: "show", f: FEATURES[i].id });
  else if (i >= FEATURES.length) live.send({ t: "phase", p: "summary" });
}

function renderSummary(){
  view = "summary";
  const by = c => FEATURES.filter(f => st.locked[f.id] && st.locked[f.id].c === c);
  const open = FEATURES.filter(f => !st.locked[f.id]);
  const splits = FEATURES.filter(f => st.locked[f.id] && st.locked[f.id].split);
  const li = (arr, sub) => arr.length ? arr.map((f, i) => `<li style="animation-delay:${i * 70}ms">${esc(f.name)}${sub ? `<small>${esc(f.hand)}</small>` : ""}</li>`).join("") : '<li class="tag">Ingen</li>';
  const w = by("wait").length, h = by("hand").length, n = by("need").length;
  main.innerHTML = `<div class="sum">
    <h1><em>${w} av ${FEATURES.length}</em> trenger ingenting nå. ${h} får en manuell løsning. ${n} må gjøres før vi lanserer.</h1>
    ${splits.length ? `<p class="splits">Rommet var uenig om ${splits.map(f => esc(f.name).toLowerCase()).join(", ")}.</p>` : ""}
    ${open.length ? `<p class="tag">${open.length} funksjoner er ikke avgjort.</p>` : ""}
    <div class="cols3"><div><h2 style="color:var(--need)">${LABEL.need}</h2><ul>${li(by("need"))}</ul></div>
      <div><h2 style="color:var(--hand)">${LABEL.hand}</h2><ul>${li(by("hand"), true)}</ul></div>
      <div class="wait"><h2 style="color:var(--wait)">${LABEL.wait}</h2><ul>${li(by("wait"))}</ul></div></div>
    <div class="foot"><button class="btn" id="back">Tilbake til stemmingen</button><span style="flex:1"></span><button class="btn" id="reset">Nullstill møtet</button></div></div>`;
  document.getElementById("back").onclick = () => live.send({ t: "phase", p: "vote" });
  const r = document.getElementById("reset");
  r.onclick = () => { if (r.dataset.armed) live.send({ t: "reset" }); else { r.dataset.armed = 1; r.textContent = "Trykk igjen for å slette alle stemmer"; } };
}

document.addEventListener("keydown", e => {
  if (!st || e.metaKey || e.ctrlKey || e.altKey) return;
  if (st.phase === "lobby" && (e.key === "ArrowRight" || e.key === "Enter")) live.send({ t: "show", f: nextOpen(-1) || FEATURES[0].id });
  else if (st.phase === "vote") {
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "l" || e.key === "L") { const a = analyse(tally(st.cur)); if (st.locked[st.cur]) live.send({ t: "unlock", f: st.cur }); else if (a.top && revealed()) doLock(a.top); }
    else if (["1","2","3"].includes(e.key) && revealed()) doLock(["need","hand","wait"][+e.key - 1]);
    else if (e.key === "s" || e.key === "S") live.send({ t: "phase", p: "summary" });
    else if (e.key === "v" || e.key === "V") live.send({ t: "reveal" });
    else if (e.key === "t" || e.key === "T") live.send({ t: "extend" });
  }
});
</script>
